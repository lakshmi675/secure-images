name: daily-build

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false
      only:
        description: "Limit to image or image:line, e.g. tomcat or tomcat:10.1 (empty = all)"
        type: string
        default: ""

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: imjasonh/setup-crane@v0.4
      - uses: aquasecurity/setup-trivy@v0.2.2
      - run: pip install pyyaml
      - id: detect
        env:
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: python scripts/detect.py

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions: { contents: read, packages: write, id-token: write, issues: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "STAMP=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v3
      - uses: imjasonh/setup-crane@v0.4
      - uses: aquasecurity/setup-trivy@v0.2.2

      - name: Build candidate (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          platforms: linux/amd64
          tags: candidate:${{ matrix.id }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.id }}

      - name: Smoke test
        run: bash ${{ matrix.context }}/smoke-test.sh candidate:${{ matrix.id }}

      - name: Scan candidate
        id: scan
        run: |
          trivy image --quiet --scanners vuln --format json --output trivy-all.json candidate:${{ matrix.id }}
          trivy image --quiet --scanners vuln --ignore-unfixed --format json --output trivy.json candidate:${{ matrix.id }}
          echo "ids=$(jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | join(" ")' trivy.json)" >> "$GITHUB_OUTPUT"
          docker image inspect candidate:${{ matrix.id }} --format '{{.Size}}' > size.txt

      - name: Baseline comparison (public image)
        continue-on-error: true
        run: |
          docker pull "${{ matrix.baseline }}"
          trivy image --quiet --scanners vuln --format json --output baseline.json "${{ matrix.baseline }}"
          docker image inspect "${{ matrix.baseline }}" --format '{{.Size}}' > baseline-size.txt

      - name: Build and push multi-arch (immutable timestamp tag)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ env.IMAGE }}:${{ matrix.version }}-${{ env.STAMP }}
          provenance: mode=max
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.created=${{ env.STAMP }}
            io.secure-images.version=${{ matrix.version }}
            io.secure-images.pins=${{ matrix.pins }}
            io.secure-images.fixable-vulns=${{ steps.scan.outputs.ids }}
            io.secure-images.rebuild-reason=${{ matrix.reasons }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.id }}

      - name: Sign image (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: SBOM (SPDX) and attestation
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "$IMAGE@${{ steps.push.outputs.digest }}" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Vulnerability attestation
        run: |
          trivy image --quiet --format cosign-vuln --output vuln.json "$IMAGE@${{ steps.push.outputs.digest }}"
          cosign attest --yes --type vuln --predicate vuln.json "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Promote floating tags (only after sign and attest)
        run: |
          crane tag "$IMAGE@${{ steps.push.outputs.digest }}" "${{ matrix.version }}"
          crane tag "$IMAGE@${{ steps.push.outputs.digest }}" "${{ matrix.id }}"

      - name: Write build record for the site
        run: |
          extra=""
          if [ -s baseline.json ]; then
            extra="--baseline-trivy baseline.json --baseline-ref ${{ matrix.baseline }} --baseline-size-bytes $(cat baseline-size.txt)"
          fi
          python3 scripts/record_build.py --image "${{ matrix.image }}" --line "${{ matrix.id }}" \
            --version "${{ matrix.version }}" --tag "${{ matrix.version }}-${{ env.STAMP }}" \
            --digest "${{ steps.push.outputs.digest }}" --reasons "${{ matrix.reasons }}" \
            --sbom sbom.spdx.json --trivy trivy-all.json --size-bytes "$(cat size.txt)" \
            --out "record-${{ matrix.image }}-${{ matrix.id }}.json" $extra
      - uses: actions/upload-artifact@v4
        with:
          name: record-${{ matrix.image }}-${{ matrix.id }}
          path: record-${{ matrix.image }}-${{ matrix.id }}.json

      - name: Open issue if fixable HIGH/CRITICAL survive the rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy.json)
          title="Fixable HIGH/CRITICAL in ${{ matrix.image }}:${{ matrix.id }}"
          if [ "$n" -gt 0 ] && [ -z "$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')" ]; then
            gh issue create --title "$title" --body "Build ${{ env.STAMP }} still has $n fixable HIGH/CRITICAL findings. IDs: ${{ steps.scan.outputs.ids }}"
          fi

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}:${{ matrix.id }} -> ${{ matrix.version }}-${{ env.STAMP }}"
            echo "- reason: ${{ matrix.reasons }}"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-site:
    needs: [detect, build]
    if: always() && needs.detect.result == 'success'
    uses: ./.github/workflows/site.yml
    permissions: { contents: write, pages: write, id-token: write }
